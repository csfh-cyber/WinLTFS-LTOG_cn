name: Windows Chinese installer

on:
  push:
    branches: [LTOG_cn_20261029, LTOG_cn_20261112]
  workflow_dispatch:

permissions:
  contents: read

env:
  INSTALLER_VERSION: ${{ github.ref_name == 'LTOG_cn_20261112' && '2.0.1' || '2.0.0' }}

concurrency:
  group: windows-cn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    name: Build and verify Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify backend matches upstream
        run: |
          git fetch --no-tags https://github.com/rlaphoenix/LTOG.git 85756fe86b6e3581785f5630dfdc758c84adedc2
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the upstream verification baseline.' }
          git diff --exit-code 85756fe86b6e3581785f5630dfdc758c84adedc2 -- src/Core src/ViewModels/DriveStore.cs src/ViewModels/SchemaParser.cs src/ViewModels/Catalog.cs src/App.xaml.cs
          if ($LASTEXITCODE -ne 0) { throw 'Backend differs from the upstream baseline.' }

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~\.nuget\packages
          key: windows-cn-nuget-${{ hashFiles('src/LTOG.csproj') }}
          restore-keys: windows-cn-nuget-

      - name: Test UI notifications and close protection
        run: |
          dotnet run --project tests/UiChecks/UiChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'UI notification checks failed.' }

      - name: Build complete installer
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          pwsh -NoProfile -ExecutionPolicy Bypass -File build.ps1 -Version $env:INSTALLER_VERSION *>&1 | Tee-Object artifacts/build-windows.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed.' }

      - name: Verify installation, startup and idle shutdown
        run: |
          ./scripts/Test-WindowsPackage.ps1 -InstallerPath "installer/Output/LTOG-${env:INSTALLER_VERSION}-setup.exe" -LogDirectory artifacts

      - name: Record build identity and checksum
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $installer = Get-Item "installer/Output/LTOG-${env:INSTALLER_VERSION}-setup.exe"
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content artifacts/SHA256SUMS.txt -Encoding utf8
          @{
            commit = $env:BUILD_COMMIT
            run = $env:BUILD_URL
            installer = $installer.Name
            sha256 = $hash
            bytes = $installer.Length
            validation = 'Windows x64 build, UI checks, silent installation, GUI startup and idle shutdown; no tape hardware I/O test'
          } | ConvertTo-Json | Set-Content artifacts/build-info.json -Encoding utf8
          "Installer: $($installer.Name)`n`nCommit: $env:BUILD_COMMIT`n`nSHA256: $hash" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LTOG-cn-windows-x64-${{ github.sha }}
          path: |
            installer/Output/LTOG-${{ env.INSTALLER_VERSION }}-setup.exe
            artifacts/SHA256SUMS.txt
            artifacts/build-info.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LTOG-cn-build-logs-${{ github.run_id }}
          path: artifacts/*.log
          if-no-files-found: ignore
          retention-days: 14

  publish-release:
    name: Publish LTOG_cn_20261112
    needs: build-installer
    if: github.ref == 'refs/heads/LTOG_cn_20261112'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: LTOG_cn_20261112
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the installer from the verified build
        uses: actions/download-artifact@v4
        with:
          name: LTOG-cn-windows-x64-${{ github.sha }}
          path: verified-package

      - name: Verify checksum and prepare release files
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path

          package = Path('verified-package')
          info_file = package / 'artifacts/build-info.json'
          info = json.loads(info_file.read_text(encoding='utf-8-sig'))
          installer_name = f"LTOG-{os.environ['INSTALLER_VERSION']}-setup.exe"
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          assert info['commit'] == os.environ['GITHUB_SHA']
          assert info['run'] == run_url and info['installer'] == installer_name
          installer = package / 'installer/Output' / installer_name
          assert installer.stat().st_size == info['bytes']
          checksum = hashlib.sha256(installer.read_bytes()).hexdigest()
          assert checksum == info['sha256']
          checksum_line = f'{checksum}  {installer_name}'
          assert (package / 'artifacts/SHA256SUMS.txt').read_text(encoding='utf-8-sig').strip() == checksum_line

          assets = Path('release-assets')
          assets.mkdir()
          shutil.copy2(installer, assets / installer_name)
          shutil.copy2(info_file, assets / info_file.name)
          (assets / 'SHA256SUMS.txt').write_text(checksum_line + '\n', encoding='utf-8')
          notes = Path(f"docs/releases/{os.environ['RELEASE_TAG']}.md").read_text(encoding='utf-8').rstrip()
          notes += f'\n\n[Windows 构建与安装验证]({run_url})\n\n'
          notes += f'`{installer_name}` 的 SHA256\n\n```text\n{checksum}\n```\n'
          Path('release-notes.md').write_text(notes, encoding='utf-8')
          PY

      - name: Publish the verified installer and Chinese release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json &&
             jq -e '.isDraft == false' existing-release.json > /dev/null; then
            echo "Release $RELEASE_TAG is already published."
            exit 0
          fi

          tag_sha=$(git ls-remote --refs origin "refs/tags/$RELEASE_TAG" | cut -f1)
          if [[ -z "$tag_sha" ]]; then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" > /dev/null
          elif [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::The release tag points to a different commit."
            exit 1
          fi

          if [[ ! -s existing-release.json ]]; then
            gh release create "$RELEASE_TAG" --draft --verify-tag --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
          installer="LTOG-$INSTALLER_VERSION-setup.exe"
          gh release upload "$RELEASE_TAG" "release-assets/$installer" \
            release-assets/SHA256SUMS.txt release-assets/build-info.json --clobber
          gh release download "$RELEASE_TAG" --pattern "$installer" --dir uploaded-package
          (cd uploaded-package && sha256sum --check ../release-assets/SHA256SUMS.txt)
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file release-notes.md
